        notes: 'সম্পূর্ণ ফ্ল্যাট স্লিপার বাঙ্ক বেড, নরম কম্বল, পর্দা ও মোবাইল চার্জার।'
      },
      {
        id: 'f-inter',
        operatorName: 'আন্তঃজেলা নিয়মিত সিটিং ও মেইল বাস',
        busType: 'inter-district',
        serviceClass: 'non-ac',
        fareAmount: Math.round(brtaAmount * 1.05),
        fareCategory: 'operator-published',
        fareSource: 'মহাসড়ক নিয়মিত সার্ভিস রেট',
        departure: 'প্রতি ১৫ মিনিট পর পর',
        seats: 20,
        highway: 'স্বাভাবিক গতি',
        verifiedAt: 'রিয়েলটাইম লাইভ',
        status: 'verified',
        notes: 'মাঝের সকল জেলা ও স্টেশনে যাত্রী ওঠানামা সুবিধা।'
      },
      {
        id: 'f-local',
        operatorName: 'সাধারণ লোকাল বাস',
        busType: 'local',
        serviceClass: 'non-ac',
        fareAmount: Math.round(brtaAmount * 0.95),
        fareCategory: 'official',
        fareSource: 'বিআরটিএ সাধারণ লোকাল তালিকা',
        departure: 'প্রতি ১০ মিনিট অন্তর',
        seats: 30,
        highway: 'সাধারণ গতি',
        verifiedAt: 'রিয়েলটাইম লাইভ',
        status: 'verified',
        notes: 'সাশ্রয়ী সাধারণ ভাড়া।'
      },
      {
        id: 'f-city',
        operatorName: 'কানেক্টিং মেট্রো ও এক্সপ্রেস শাটল বাস',
        busType: 'city-service',
        serviceClass: 'non-ac',
        fareAmount: Math.max(15, Math.round(brtaAmount * 0.9)),
        fareCategory: 'operator-published',
        fareSource: 'মেট্রো শাটল সংযোগ চার্ট',
        departure: 'প্রতি ১০-১৫ মিনিট পর পর',
        seats: 22,
        highway: 'স্বাভাবিক গতি',
        verifiedAt: 'রিয়েলটাইম লাইভ',
        status: 'verified',
        notes: 'টার্মিনাল ও শহর সংযোগকারী নিয়মিত সিটি ও ফিডার এক্সপ্রেস সার্ভিস।'
      }
    ];
  }

  // State
  var state = {
    origin: 'dhaka',
    destination: 'chittagong',
    busType: 'all',
    serviceClass: 'all',
    filterTab: 'all',
    sortBy: 'fare-asc',
    verifiedOnly: false,
    favorites: [],
    currentTime: new Date()
  };

  // Clock Ticker for Live Countdown Seconds
  setInterval(function() {
    state.currentTime = new Date();
    var liveTimes = document.querySelectorAll('.mosafa-busfare-live-time');
    var min = state.currentTime.getMinutes();
    var sec = state.currentTime.getSeconds();
    var remMin = 14 - (min % 15);
    var remSec = 59 - sec;
    var timeStr = remMin + ' মি. ' + (remSec < 10 ? '০' : '') + remSec + ' সে. পর';
    liveTimes.forEach(function(el) {
      el.textContent = 'পরবর্তী বাস: ' + timeStr;
    });
  }, 1000);

  function getClassLabel(c) {
    if (c === 'non-ac') return 'নন-এসি (Non-AC)';
    if (c === 'ac-chair') return 'এসি চেয়ার কোচ';
    if (c === 'business-class') return 'বিজনেস ক্লাস';
    if (c === 'sleeper-coach') return 'স্লিপার কোচ';
    return c;
  }

  function getBadgeHtml(cat) {
    if (cat === 'official') return '<span class="mosafa-busfare-badge mosafa-busfare-badge-official">🏛️ অফিসিয়াল গেজেট (BRTA)</span>';
    if (cat === 'operator-published') return '<span class="mosafa-busfare-badge mosafa-busfare-badge-operator">🏷️ অপারেটর চার্ট</span>';
    return '<span class="mosafa-busfare-badge mosafa-busfare-badge-community">👥 যাত্রী রিপোর্ট</span>';
  }

  function getFilteredFares() {
    var list = generateAllActiveFares(state.origin, state.destination);

    if (state.busType !== 'all') {
      var byType = list.filter(function(item) { return item.busType === state.busType; });
      if (byType.length > 0) list = byType;
    }
    if (state.serviceClass !== 'all') {
      var byClass = list.filter(function(item) { return item.serviceClass === state.serviceClass; });
      if (byClass.length > 0) list = byClass;
    }
    if (state.filterTab === 'non-ac') {
      var nonAc = list.filter(function(item) { return item.serviceClass === 'non-ac'; });
      if (nonAc.length > 0) list = nonAc;
    } else if (state.filterTab === 'ac') {
      var ac = list.filter(function(item) { return item.serviceClass !== 'non-ac'; });
      if (ac.length > 0) list = ac;
    }

    list.sort(function(a, b) {
      if (state.sortBy === 'fare-asc') return a.fareAmount - b.fareAmount;
      if (state.sortBy === 'fare-desc') return b.fareAmount - a.fareAmount;
      return a.operatorName.localeCompare(b.operatorName, 'bn');
    });

    return list;
  }

  function render() {
    var container = document.getElementById('mosafa-busfare-container');
    if (!container) return;

    var originObj = LOCATIONS.find(function(l) { return l.id === state.origin; }) || { name: state.origin };
    var destObj = LOCATIONS.find(function(l) { return l.id === state.destination; }) || { name: state.destination };
    var dist = getDistance(state.origin, state.destination);
    var tollObj = checkToll(state.origin, state.destination);
    var fares = getFilteredFares();
    var lowestFare = Math.min.apply(null, fares.map(function(f) { return f.fareAmount; }));

    var html = '';

    // Hero Section
    html += '<div class="text-center py-6 mb-6 rounded-3xl bg-gradient-to-b from-sky-100/70 via-blue-50/40 to-slate-50 border border-sky-200/60 p-4 sm:p-6">';
    html += '<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-emerald-50 border border-emerald-300 text-emerald-800 text-xs font-bold mb-3">⚡ সকল বাস সার্ভিস ১০০% সক্রিয় ও রিয়েলটাইমে লাইভ</div>';
    html += '<h2 class="text-2xl sm:text-4xl font-black text-slate-900">কোন বাসে <span class="text-sky-600">কত ভাড়া?</span></h2>';
    html += '<p class="text-xs sm:text-sm text-slate-600 mt-1 max-w-lg mx-auto">বাংলাদেশের সকল রুটের বাস ভাড়া, এসি/নন-এসি শ্রেণি, কাউন্টার ও রিয়েলটাইম শিডিউল।</p>';

    // Popular Route Chips
    html += '<div class="flex items-center justify-center gap-2 mt-4 flex-wrap text-xs">';
    html += '<button type="button" class="mosafa-busfare-pop-chip px-3 py-1 rounded-xl bg-white border border-slate-200 hover:border-sky-400 font-bold cursor-pointer" data-from="dhaka" data-to="chittagong">🌊 ঢাকা ➔ চট্টগ্রাম</button>';
    html += '<button type="button" class="mosafa-busfare-pop-chip px-3 py-1 rounded-xl bg-white border border-slate-200 hover:border-sky-400 font-bold cursor-pointer" data-from="dhaka" data-to="sylhet">🍵 ঢাকা ➔ সিলেট</button>';
    html += '<button type="button" class="mosafa-busfare-pop-chip px-3 py-1 rounded-xl bg-white border border-slate-200 hover:border-sky-400 font-bold cursor-pointer" data-from="dhaka" data-to="coxs-bazar">🏖️ ঢাকা ➔ কক্সবাজার</button>';
    html += '<button type="button" class="mosafa-busfare-pop-chip px-3 py-1 rounded-xl bg-white border border-slate-200 hover:border-sky-400 font-bold cursor-pointer" data-from="dhaka" data-to="khulna">🌉 ঢাকা ➔ খুলনা (পদ্মা সেতু)</button>';
    html += '<button type="button" class="mosafa-busfare-pop-chip px-3 py-1 rounded-xl bg-white border border-slate-200 hover:border-sky-400 font-bold cursor-pointer" data-from="mirpur-10" data-to="motijheel">🚌 মিরপুর ১০ ➔ মতিঝিল</button>';
    html += '</div></div>';

    // Search Card
    html += '<div class="mosafa-busfare-card p-5 sm:p-7 mb-6 shadow-sm">';
    html += '<div class="grid grid-cols-1 md:grid-cols-11 gap-3 items-end">';

    // Origin Selector
    html += '<div class="md:col-span-5">';
    html += '<label class="block text-xs font-bold text-slate-700 mb-1">📍 কোথা থেকে যাত্রা করবেন?</label>';
    html += '<select id="mosafa-busfare-origin-select" class="mosafa-busfare-select font-bold">';
    LOCATIONS.forEach(function(l) {
      var sel = (l.id === state.origin) ? 'selected' : '';
      html += '<option value="' + l.id + '" ' + sel + '>' + l.name + ' (' + l.district + ')</option>';
    });
    html += '</select></div>';

    // Swap Button
    html += '<div class="md:col-span-1 text-center py-1">';
    html += '<button type="button" id="mosafa-busfare-swap-btn" class="w-10 h-10 rounded-xl border border-slate-200 bg-slate-100 hover:bg-sky-100 text-slate-700 font-bold text-base transition cursor-pointer" title="স্থান বদল">⇄</button>';
    html += '</div>';

    // Destination Selector
    html += '<div class="md:col-span-5">';
    html += '<label class="block text-xs font-bold text-slate-700 mb-1">🎯 কোথায় যাবেন?</label>';
    html += '<select id="mosafa-busfare-dest-select" class="mosafa-busfare-select font-bold">';
    LOCATIONS.forEach(function(l) {
      var sel = (l.id === state.destination) ? 'selected' : '';
      html += '<option value="' + l.id + '" ' + sel + '>' + l.name + ' (' + l.district + ')</option>';
    });
    html += '</select></div>';
    html += '</div>';

    // Secondary Filters
    html += '<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-3 mt-4 pt-4 border-t border-slate-100">';
    html += '<div><label class="block text-[11px] font-bold text-slate-600 mb-1">বাসের ধরন</label>';
    html += '<select id="mosafa-busfare-type-select" class="mosafa-busfare-select font-bold text-xs">';
    html += '<option value="all" ' + (state.busType === 'all' ? 'selected' : '') + '>সকল ধরন</option>';
    html += '<option value="long-distance" ' + (state.busType === 'long-distance' ? 'selected' : '') + '>দূরপাল্লার কোচ</option>';
    html += '<option value="inter-district" ' + (state.busType === 'inter-district' ? 'selected' : '') + '>আন্তঃজেলা বাস</option>';
    html += '<option value="city-service" ' + (state.busType === 'city-service' ? 'selected' : '') + '>সিটি সার্ভিস</option>';
    html += '<option value="local" ' + (state.busType === 'local' ? 'selected' : '') + '>লোকাল বাস</option>';
    html += '</select></div>';

    html += '<div><label class="block text-[11px] font-bold text-slate-600 mb-1">সার্ভিস ক্লাস</label>';
    html += '<select id="mosafa-busfare-class-select" class="mosafa-busfare-select font-bold text-xs">';
    html += '<option value="all" ' + (state.serviceClass === 'all' ? 'selected' : '') + '>সকল ক্লাস</option>';
    html += '<option value="non-ac" ' + (state.serviceClass === 'non-ac' ? 'selected' : '') + '>নন-এসি</option>';
    html += '<option value="ac-chair" ' + (state.serviceClass === 'ac-chair' ? 'selected' : '') + '>এসি চেয়ার কোচ</option>';
    html += '<option value="business-class" ' + (state.serviceClass === 'business-class' ? 'selected' : '') + '>বিজনেস ক্লাস</option>';
    html += '<option value="sleeper-coach" ' + (state.serviceClass === 'sleeper-coach' ? 'selected' : '') + '>স্লিপার কোচ</option>';
    html += '</select></div>';

    html += '<div class="sm:col-span-2 flex items-end">';
    html += '<button type="button" id="mosafa-busfare-search-btn" class="mosafa-busfare-btn-primary w-full text-xs font-black">ভাড়া ও রিয়েলটাইম লাইভ শিডিউল খুঁজুন 🔍</button>';
    html += '</div></div></div>';

    // Route Stats Banner
    html += '<div class="p-4 sm:p-5 mb-5 rounded-2xl bg-slate-900 text-white flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">';
    html += '<div><div class="text-[10px] uppercase font-bold text-sky-400">রিয়েলটাইম লাইভ রুট</div>';
    html += '<h3 class="text-xl font-black text-white">' + originObj.name + ' ➔ ' + destObj.name + '</h3>';
    if (tollObj.hasToll) {
      html += '<p class="text-xs text-amber-300 font-semibold mt-0.5">🌉 ' + tollObj.name + ' টোল এক্সপ্রেসওয়ে অন্তর্ভুক্ত</p>';
    }
    html += '</div>';
    html += '<div class="flex items-center gap-2 text-xs flex-wrap">';
    html += '<div class="bg-white/10 px-3 py-1.5 rounded-xl font-bold">দূরত্ব: ' + dist + ' কিমি</div>';
    html += '<div class="bg-emerald-500/20 text-emerald-300 px-3 py-1.5 rounded-xl font-bold">সর্বনিম্ন ভাড়া: ৳' + lowestFare + '</div>';
    html += '</div></div>';

    // Filter Tabs
    html += '<div class="flex items-center justify-between gap-3 mb-4 flex-wrap">';
    html += '<div class="flex items-center gap-1.5 bg-slate-200/80 p-1 rounded-xl text-xs font-bold">';
    html += '<button type="button" class="mosafa-busfare-tab-btn px-3 py-1.5 rounded-lg cursor-pointer ' + (state.filterTab === 'all' ? 'bg-white shadow-xs' : '') + '" data-tab="all">সকল সার্ভিস (' + fares.length + ')</button>';
    html += '<button type="button" class="mosafa-busfare-tab-btn px-3 py-1.5 rounded-lg cursor-pointer ' + (state.filterTab === 'non-ac' ? 'bg-white shadow-xs' : '') + '" data-tab="non-ac">নন-এসি</button>';
    html += '<button type="button" class="mosafa-busfare-tab-btn px-3 py-1.5 rounded-lg cursor-pointer ' + (state.filterTab === 'ac' ? 'bg-white shadow-xs' : '') + '" data-tab="ac">এসি ও স্লিপার</button>';
    html += '</div>';

    html += '<div class="flex items-center gap-2 text-xs font-bold">';
    html += '<select id="mosafa-busfare-sort-select" class="px-2 py-1.5 rounded-xl border border-slate-300 bg-white text-xs cursor-pointer">';
    html += '<option value="fare-asc" ' + (state.sortBy === 'fare-asc' ? 'selected' : '') + '>ভাড়া: কম থেকে বেশি ৳</option>';
    html += '<option value="fare-desc" ' + (state.sortBy === 'fare-desc' ? 'selected' : '') + '>ভাড়া: বেশি থেকে কম ৳</option>';
    html += '<option value="operator" ' + (state.sortBy === 'operator' ? 'selected' : '') + '>অপারেটরের নাম</option>';
    html += '</select>';
    html += '</div></div>';

    // Results List: Cards
    html += '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
    fares.forEach(function(fare) {
      var isLow = (fare.fareAmount === lowestFare);
      html += '<div class="mosafa-busfare-card p-5 flex flex-col justify-between ' + (isLow ? 'mosafa-busfare-lowest' : '') + '">';
      html += '<div class="space-y-3">';

      html += '<div class="flex items-start justify-between gap-2">';
      html += '<div>';
      html += '<div class="flex items-center gap-1.5 flex-wrap mb-1">';
      html += '<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-700 text-[10px] font-bold border border-emerald-200">🟢 সক্রিয় সার্ভিস</span>';
      if (fare.seats) {
        html += '<span class="px-1.5 py-0.5 rounded bg-blue-50 text-blue-700 text-[10px] font-bold border border-blue-200">💺 ' + fare.seats + 'টি সিট ফাঁকা</span>';
      }
      html += '</div>';
      html += '<h4 class="text-base font-black text-slate-900 leading-tight">' + fare.operatorName + '</h4>';
      html += '<span class="inline-block mt-0.5 text-xs font-bold text-sky-700 bg-sky-50 px-2 py-0.5 rounded border border-sky-200">' + getClassLabel(fare.serviceClass) + '</span>';
      html += '</div>';
      html += '<div class="text-right shrink-0">';
      html += '<span class="text-2xl font-black text-slate-900">৳' + fare.fareAmount + '</span>';
      html += '<span class="block text-[10px] text-slate-400 font-semibold">জনপ্রতি</span>';
      html += '</div></div>';

      // Live Schedule & Departure
      html += '<div class="p-2.5 rounded-xl bg-slate-50 border border-slate-200 text-xs flex items-center justify-between gap-2">';
      html += '<span class="font-bold text-slate-700">🕒 ' + fare.departure + '</span>';
      html += '<span class="mosafa-busfare-live-time font-extrabold text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-lg text-[11px]">পরবর্তী বাস: ৫ মি. পর</span>';
      html += '</div>';

      html += '<div>' + getBadgeHtml(fare.fareCategory) + '</div>';

      if (fare.notes) {
        html += '<p class="text-[11px] text-slate-500 pt-1 leading-relaxed">💡 ' + fare.notes + '</p>';
      }

      html += '<div class="bg-slate-50 p-2 rounded-xl border border-slate-200 text-[11px] text-slate-600 flex items-center justify-between">';
      html += '<span class="font-bold">উৎস: ' + fare.fareSource + '</span>';
      html += '<span class="text-[10px] text-slate-400">' + fare.verifiedAt + '</span>';
      html += '</div>';

      html += '</div>'; // End space-y-3
      html += '</div>'; // End Card
    });
    html += '</div>';

    container.innerHTML = html;
    attachEvents();
  }

  function attachEvents() {
    var originSelect = document.getElementById('mosafa-busfare-origin-select');
    var destSelect = document.getElementById('mosafa-busfare-dest-select');
    var typeSelect = document.getElementById('mosafa-busfare-type-select');
    var classSelect = document.getElementById('mosafa-busfare-class-select');
    var sortSelect = document.getElementById('mosafa-busfare-sort-select');
    var swapBtn = document.getElementById('mosafa-busfare-swap-btn');
    var searchBtn = document.getElementById('mosafa-busfare-search-btn');

    if (originSelect) {
      originSelect.addEventListener('change', function(e) {
        state.origin = e.target.value;
      });
    }
    if (destSelect) {
      destSelect.addEventListener('change', function(e) {
        state.destination = e.target.value;
      });
    }
    if (typeSelect) {
      typeSelect.addEventListener('change', function(e) {
        state.busType = e.target.value;
      });
    }
    if (classSelect) {
      classSelect.addEventListener('change', function(e) {
        state.serviceClass = e.target.value;
      });
    }
    if (sortSelect) {
      sortSelect.addEventListener('change', function(e) {
        state.sortBy = e.target.value;
        render();
      });
    }
    if (swapBtn) {
      swapBtn.addEventListener('click', function() {
        var temp = state.origin;
        state.origin = state.destination;
        state.destination = temp;
        render();
      });
    }
    if (searchBtn) {
      searchBtn.addEventListener('click', function() {
        render();
      });
    }

    var popChips = document.querySelectorAll('.mosafa-busfare-pop-chip');
    popChips.forEach(function(chip) {
      chip.addEventListener('click', function() {
        state.origin = chip.getAttribute('data-from');
        state.destination = chip.getAttribute('data-to');
        state.busType = 'all';
        state.serviceClass = 'all';
        render();
      });
    });

    var tabBtns = document.querySelectorAll('.mosafa-busfare-tab-btn');
    tabBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        state.filterTab = btn.getAttribute('data-tab') || 'all';
        render();
      });
    });
  }

  function init() {
    render();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  return {
    init: init,
    getState: function() { return state; }
  };
})();
</script>
