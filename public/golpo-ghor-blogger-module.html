  function loadLocalData() {
    try {
      state.bookmarks = JSON.parse(localStorage.getItem('mosafa_golpo_bookmarks') || '[]');
      state.readingHistory = JSON.parse(localStorage.getItem('mosafa_golpo_history') || '{}');
      state.readerPrefs = JSON.parse(localStorage.getItem('mosafa_golpo_reader_prefs') || '{"fontSize":"medium","lineHeight":"relaxed","theme":"light"}');
    } catch (e) {}
  }

  function saveLocalData() {
    try {
      localStorage.setItem('mosafa_golpo_bookmarks', JSON.stringify(state.bookmarks));
      localStorage.setItem('mosafa_golpo_history', JSON.stringify(state.readingHistory));
      localStorage.setItem('mosafa_golpo_reader_prefs', JSON.stringify(state.readerPrefs));
    } catch (e) {}
  }

  // 4. Router & Query Param Reader
  function checkRoute() {
    var params = new URLSearchParams(window.location.search);
    var storySlug = params.get('story');
    if (storySlug) {
      var found = STORIES.find(function(s) { return s.slug === storySlug; });
      if (found) {
        openStory(found, false);
        return;
      }
    }
    state.activeStory = null;
    render();
  }

  function openStory(story, pushState) {
    state.activeStory = story;
    state.activeChapterIndex = 0;
    if (pushState !== false) {
      var newUrl = window.location.pathname + '?tool=golpo-ghor&story=' + story.slug;
      window.history.pushState({ tool: 'golpo-ghor', story: story.slug }, '', newUrl);
    }
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }

  function closeStory() {
    state.activeStory = null;
    var newUrl = window.location.pathname + '?tool=golpo-ghor';
    window.history.pushState({ tool: 'golpo-ghor' }, '', newUrl);
    window.scrollTo({ top: 0, behavior: 'smooth' });
    render();
  }

  function toggleBookmark(storyId) {
    var idx = state.bookmarks.indexOf(storyId);
    if (idx > -1) {
      state.bookmarks.splice(idx, 1);
    } else {
      state.bookmarks.push(storyId);
    }
    saveLocalData();
    render();
  }

  // 5. Main Render Function
  function render() {
    var container = document.getElementById('mosafa-golpo-ghor-container');
    if (!container) return;

    if (state.activeStory) {
      renderReader(container);
    } else {
      renderLibrary(container);
    }
  }

  // Render Reader

    var story = state.activeStory;
    var chapter = story.chapters[state.activeChapterIndex] || story.chapters[0];
    var isBookmarked = state.bookmarks.indexOf(story.id) > -1;

    var themeClass = state.readerPrefs.theme === 'sepia' ? 'mgg-reader-sepia' : (state.readerPrefs.theme === 'dark' ? 'mgg-reader-dark' : 'mgg-reader-light');
    var fontSizeStyle = state.readerPrefs.fontSize === 'small' ? '1rem' : (state.readerPrefs.fontSize === 'large' ? '1.35rem' : '1.15rem');

    var html = '<div class="p-4 sm:p-8 rounded-3xl border shadow-sm transition-colors ' + themeClass + '" id="mgg-print-area">';
    
    // Top Bar
    html += '<div class="flex items-center justify-between pb-4 border-b border-current/20 mb-6 mgg-no-print">';
    html += '<button onclick="MoSaFaGolpoGhor.closeStory()" class="px-3.5 py-1.5 rounded-xl border font-bold text-xs bg-white/40 dark:bg-slate-800 cursor-pointer">⬅️ লাইব্রেরি</button>';
    html += '<div class="text-center truncate max-w-xs"><h3 class="font-bold text-sm truncate">' + story.title + '</h3><span class="text-[11px] opacity-75">' + story.author + '</span></div>';
    html += '<div class="flex items-center gap-2">';
    html += '<button onclick="MoSaFaGolpoGhor.toggleBookmark(\'' + story.id + '\')" class="px-3 py-1.5 rounded-xl border text-xs font-bold cursor-pointer">' + (isBookmarked ? '🔖 বুকমার্কড' : '🔖 বুকমার্ক') + '</button>';
    html += '<button onclick="window.print()" class="px-3 py-1.5 rounded-xl border text-xs font-bold cursor-pointer hidden sm:inline">🖨️ প্রিন্ট</button>';
    html += '</div></div>';

    // Metadata & Attribution
    html += '<div class="mb-6"><span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-500/10 text-rose-600 mr-2">' + story.category + '</span>';
    html += '<span class="text-xs font-bold opacity-75">⏱️ ' + story.estimatedReadingMinutes + ' মিনিট পাঠ</span>';
    html += '<h1 class="text-2xl sm:text-4xl font-extrabold mt-3">' + story.title + '</h1>';
    html += '<p class="text-base font-bold opacity-80 mt-1">লেখক: ' + story.author + '</p>';
    html += '<div class="mt-3 p-3 rounded-2xl bg-current/5 border border-current/10 text-xs">';
    html += '<p class="font-bold text-emerald-600">🛡️ লাইসেন্স: ' + story.licenseName + '</p>';
    html += '<p class="opacity-75 mt-0.5">' + story.permissionNote + '</p>';
    html += '</div></div>';

    // Chapter Title & Body
    html += '<div class="mt-8 mb-4"><h2 class="text-xl font-bold">' + chapter.title + '</h2></div>';
    html += '<article style="font-size: ' + fontSizeStyle + '; line-height: 1.9;" class="space-y-4 select-text text-justify">';
    chapter.content.forEach(function(p) {
      html += '<p>' + p + '</p>';
    });
    html += '</article>';

    // Bottom Navigation
    html += '<div class="mt-10 pt-6 border-t border-current/20 flex items-center justify-between mgg-no-print">';
    if (state.activeChapterIndex > 0) {
      html += '<button onclick="MoSaFaGolpoGhor.prevChapter()" class="px-4 py-2 rounded-xl border text-xs font-bold cursor-pointer">⬅️ পূর্ববর্তী অধ্যায়</button>';
    } else {
      html += '<div></div>';
    }
    if (state.activeChapterIndex < story.chapters.length - 1) {
      html += '<button onclick="MoSaFaGolpoGhor.nextChapter()" class="px-4 py-2 rounded-xl bg-rose-600 text-white text-xs font-bold cursor-pointer">পরবর্তী অধ্যায় ➡️</button>';
    } else {
      html += '<span class="text-xs font-bold text-emerald-600">✅ গল্পটি সম্পূর্ণ পড়া হয়েছে!</span>';
    }
    html += '</div></div>';

    container.innerHTML = html;
  }

  // Render Library
  function renderLibrary(container) {
    var filtered = STORIES.filter(function(story) {
      if (state.selectedCategory !== 'all' && story.categorySlug !== state.selectedCategory) return false;
      if (!state.searchQuery.trim()) return true;
      var q = state.searchQuery.toLowerCase();
      return story.title.toLowerCase().indexOf(q) > -1 ||
             story.author.toLowerCase().indexOf(q) > -1 ||
             story.shortDescription.toLowerCase().indexOf(q) > -1;
    });

    var html = '<div class="space-y-8">';
    
    // Header Hero
    html += '<div class="text-center py-6 bg-gradient-to-b from-amber-50/80 to-transparent rounded-3xl p-6 border border-amber-200/60">';
    html += '<span class="px-3 py-1 rounded-full bg-rose-100 text-rose-700 text-xs font-bold">✨ বাংলা ডিজিটাল লাইব্রেরি</span>';
    html += '<h2 class="text-2xl sm:text-4xl font-black text-slate-900 mt-2">MoSaFa Golpo Ghor</h2>';
    html += '<p class="text-xs sm:text-sm text-slate-600 mt-1">আপনার পছন্দের গল্প, আপনার নিজের পড়ার জগৎ</p>';
    html += '<div class="max-w-md mx-auto mt-4"><input type="text" id="mgg-search-input" value="' + state.searchQuery + '" placeholder="গল্প বা লেখকের নাম দিয়ে খুঁজুন..." class="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-rose-500 shadow-sm" oninput="MoSaFaGolpoGhor.setSearch(this.value)"></div>';
    html += '</div>';

    // Categories Bar
    html += '<div><h3 class="font-bold text-sm mb-3">গল্পের বিভাগসমূহ:</h3><div class="flex items-center gap-2 overflow-x-auto pb-2">';
    html += '<button onclick="MoSaFaGolpoGhor.setCategory(\'all\')" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ' + (state.selectedCategory === 'all' ? 'bg-slate-900 text-white' : 'bg-white border text-slate-700') + '">সব গল্প (' + STORIES.length + ')</button>';
    CATEGORIES.forEach(function(cat) {
      var isSel = state.selectedCategory === cat.id;
      html += '<button onclick="MoSaFaGolpoGhor.setCategory(\'' + cat.id + '\')" class="px-3 py-1.5 rounded-xl text-xs font-bold shrink-0 cursor-pointer ' + (isSel ? 'bg-rose-600 text-white' : 'bg-white border text-slate-700') + '">' + cat.icon + ' ' + cat.name + '</button>';
    });
    html += '</div></div>';

    // Stories Grid
    html += '<div><h3 class="font-bold text-base mb-4">উপলব্ধ গল্পসমূহ (' + filtered.length + 'টি)</h3>';
    if (filtered.length > 0) {
      html += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">';
      filtered.forEach(function(story) {
        html += '<div onclick="MoSaFaGolpoGhor.openStoryBySlug(\'' + story.slug + '\')" class="bg-white rounded-3xl border border-slate-200 shadow-sm hover:shadow-lg transition p-5 flex flex-col justify-between cursor-pointer group">';
        html += '<div><div class="flex items-center justify-between text-xs font-bold text-slate-500 mb-2"><span class="px-2 py-0.5 rounded-md bg-slate-100">' + story.category + '</span><span>⏱️ ' + story.estimatedReadingMinutes + ' মি.</span></div>';
        html += '<h4 class="text-lg font-bold text-slate-900 group-hover:text-rose-600 transition">' + story.title + '</h4>';
        html += '<p class="text-xs font-bold text-slate-600 mt-0.5">লেখক: ' + story.author + '</p>';
        html += '<p class="text-xs text-slate-500 mt-2 line-clamp-2">' + story.shortDescription + '</p></div>';
        html += '<div class="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-bold text-rose-600"><span>পড়ুন 📖</span><span>➡️</span></div>';
        html += '</div>';
      });
      html += '</div>';
    } else {
      html += '<div class="text-center py-12 bg-white rounded-3xl border text-slate-500 text-xs">কোনো গল্প পাওয়া যায়নি! ভিন্ন কি-ওয়ার্ড দিয়ে খুঁজুন।</div>';
    }
    html += '</div></div>';

    container.innerHTML = html;
  }

  // 6. Public API
  return {
    init: function() {
      loadLocalData();
      checkRoute();
      window.addEventListener('popstate', checkRoute);
    },
    openStoryBySlug: function(slug) {
      var found = STORIES.find(function(s) { return s.slug === slug; });
      if (found) openStory(found, true);
    },
    closeStory: closeStory,
    toggleBookmark: toggleBookmark,
    setCategory: function(catId) {
      state.selectedCategory = catId;
      render();
    },
    setSearch: function(val) {
      state.searchQuery = val;
      render();
      var input = document.getElementById('mgg-search-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    },
    nextChapter: function() {
      if (state.activeStory && state.activeChapterIndex < state.activeStory.chapters.length - 1) {
        state.activeChapterIndex++;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }
    },
    prevChapter: function() {
      if (state.activeStory && state.activeChapterIndex > 0) {
        state.activeChapterIndex--;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        render();
      }
    },
    addCustomStory: function(storyObj) {
      if (storyObj && storyObj.id && storyObj.slug && storyObj.title) {
        STORIES.push(storyObj);
        render();
      }
    }
  };
})();

// Auto-run if container exists
document.addEventListener('DOMContentLoaded', function() {
  if (document.getElementById('mosafa-golpo-ghor-container')) {
    window.MoSaFaGolpoGhor.init();
  }
});
</script>
