    <!-- Smart Service Worker Registration: Safe in Dev iFrames, Full Offline & Auto-Update in Production/Mobile App -->
    <script>
      (function() {
        try {
          var isInsideIframe = window.self !== window.top;
          if (isInsideIframe) {
            // In dev preview iframe, prevent aggressive caching
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                for (var i = 0; i < regs.length; i++) {
                  regs[i].unregister();
                }
              }).catch(function() {});
            }
          } else {
            // In production, custom domain (https://themedosafe.blogspot.com/) or mobile app: Register Service Worker
            if ('serviceWorker' in navigator) {
              window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').then(function(reg) {
                  // Listen for updates
                  reg.addEventListener('updatefound', function() {
                    var newWorker = reg.installing;
                    if (newWorker) {
                      newWorker.addEventListener('statechange', function() {
                        if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                          // New version available
                          window.dispatchEvent(new CustomEvent('mosafa:new-version-available'));
                        }
                      });
                    }
                  });
                }).catch(function(err) {
                  console.warn('SW registration info:', err);
                });
              });
            }
          }
        } catch (e) {
          console.warn('SW setup info:', e);
        }
      })();
    </script>
