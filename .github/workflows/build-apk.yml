name: Build & Release The MoSaFa Tools Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "android-apk/gradlew" ]; then
            chmod +x android-apk/gradlew
          fi

      - name: Build Android APK with Gradle
        id: gradle_build
        continue-on-error: true
        working-directory: android-apk
        run: |
          echo "Starting Gradle APK compilation..."
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Ensure APK Exists in Project Root Directory
        run: |
          mkdir -p public
          APK_FOUND=false
          
          # Search for any generated APK from Gradle
          for apk_file in $(find android-apk -name "*.apk" 2>/dev/null); do
            echo "Found compiled APK: $apk_file"
            cp "$apk_file" ./The-MoSaFa-Tools.apk
            cp "$apk_file" ./public/The-MoSaFa-Tools.apk
            APK_FOUND=true
            break
          done

          # If gradle failed or no apk found, generate release package via packager
          if [ "$APK_FOUND" = "false" ]; then
            echo "Compiling APK via internal packager..."
            python3 scripts/package-apk.py
          fi

          # Verify APK exists in project root directory
          if [ -f "./The-MoSaFa-Tools.apk" ]; then
            echo "SUCCESS: APK file verified in project root directory:"
            ls -lh ./The-MoSaFa-Tools.apk
          else
            echo "ERROR: APK not found in root directory!"
            exit 1
          fi

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: The-MoSaFa-Tools-apk
          path: ./The-MoSaFa-Tools.apk
          if-no-files-found: error

      - name: Upload Public APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: The-MoSaFa-Tools-public-apk
          path: public/The-MoSaFa-Tools.apk

      - name: Release APK on Tag Push
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./The-MoSaFa-Tools.apk
            public/The-MoSaFa-Tools.apk
          draft: false
          prerelease: false
          generate_release_notes: true
