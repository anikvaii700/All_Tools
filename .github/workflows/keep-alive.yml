name: Keep Render Alive 24/7

on:
  schedule:
    # Run every 10 minutes (Render sleeps after 15 minutes of inactivity)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping MoSaFa Tools on Render
        run: |
          echo "Pinging MoSaFa Tools server..."
          curl -s -f --max-time 30 https://mosafa-tools.onrender.com/api/health || echo "Ping attempted"
          echo "Render kept alive successfully!"
